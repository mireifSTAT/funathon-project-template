[project]
name = "funathon-project2"
version = "0.1.0"
description = "ÖNACE classification prototype using embeddings"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "torch>=2.3,<2.7"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }